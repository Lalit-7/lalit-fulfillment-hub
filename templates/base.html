<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Fulfillment Hub — Internal operations tool for XYZ e-commerce">
    <title>{% block title %}Fulfillment Hub{% endblock %}</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <!-- Top Bar -->
    <header class="top-bar">
        <a href="/" class="top-bar__logo">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M20 8h-3V4H3c-1.1 0-2 .9-2 2v11h2c0 1.66 1.34 3 3 3s3-1.34 3-3h6c0 1.66 1.34 3 3 3s3-1.34 3-3h2v-5l-3-4zM6 18.5c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm13.5-9l1.96 2.5H17V9.5h2.5zm-1.5 9c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/>
            </svg>
            Fulfillment Hub
        </a>
        <nav class="top-bar__nav">
            <a href="/" class="{% if request.path == '/' %}active{% endif %}">Dashboard</a>
            <a href="/inventory" class="{% if request.path == '/inventory' %}active{% endif %}">Inventory</a>
            <a href="/transfers" class="{% if request.path == '/transfers' %}active{% endif %}">Transfers</a>
            <a href="/issues" class="{% if request.path == '/issues' %}active{% endif %}">Issues</a>
        </nav>
    </header>

    <main class="main-content {{ main_class | default('') }}">
        {% block content %}{% endblock %}
    </main>

    <script src="/static/app.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
